[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-moral-guard"
version = "0.1.0"
description = "Deterministic moral alignment & citation engine for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mysukriramli" }
]
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
