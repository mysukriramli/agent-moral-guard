[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-moral-guard"
version = "0.2.0"
description = "Deterministic moral alignment & citation engine for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mysukriramli" }
]
keywords = [
    "ai-safety",
    "autonomous-agents",
    "mcp",
    "guardrails",
    "duckdb",
    "ethics",
    "compliance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0",
    "mcp>=1.0.0,<2.0.0"
]

[project.urls]
Homepage = "https://github.com/mysukriramli/agent-moral-guard"
Repository = "https://github.com/mysukriramli/agent-moral-guard"
Issues = "https://github.com/mysukriramli/agent-moral-guard/issues"

[project.scripts]
agent-moral-guard = "moral_guard.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moral_guard = ["*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
